server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: event-sourcing-hexagonal-lab
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/event_sourcing_lab}
app:
  eventstore:
    uri: ${EVENTSTORE_URI:esdb://localhost:2113?tls=false}
  projection:
    interval-ms: ${PROJECTION_INTERVAL_MS:2000}
  lab:
    enabled: ${LAB_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
